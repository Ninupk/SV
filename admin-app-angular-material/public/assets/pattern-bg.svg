<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
  <defs>
    <pattern id="tile" width="240" height="240" patternUnits="userSpaceOnUse">
      <g fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2.2">
        <!-- wifi arcs -->
        <g transform="translate(24,24)">
          <path d="M0 18 A26 26 0 0 1 36 18" />
          <path d="M8 26 A16 16 0 0 1 28 26" />
          <circle cx="18" cy="34" r="2.4" fill="#ffffff" fill-opacity="0.06" stroke="none" />
        </g>
        <!-- plus -->
        <g transform="translate(120,20)">
          <line x1="0" y1="9" x2="18" y2="9" />
          <line x1="9" y1="0" x2="9" y2="18" />
        </g>
        <!-- star outline -->
        <path transform="translate(176,50) scale(1.1)" d="M14 0 L17.5 9.8 L28 10.3 L19.7 16.9 L22.6 27 L14 21 L5.4 27 L8.3 16.9 L0 10.3 L10.5 9.8 Z" />
        <!-- circle -->
        <circle cx="60" cy="90" r="16" />
        <!-- device / monitor -->
        <g transform="translate(150,110)">
          <rect x="0" y="0" width="44" height="30" rx="3" />
          <line x1="6" y1="6" x2="30" y2="24" />
        </g>
        <!-- cloud -->
        <path transform="translate(20,150)" d="M6 20 A10 10 0 0 1 8 0.4 A14 14 0 0 1 34 4 A9 9 0 0 1 33 20 Z" />
        <!-- small plus -->
        <g transform="translate(200,160)">
          <line x1="0" y1="6" x2="12" y2="6" />
          <line x1="6" y1="0" x2="6" y2="12" />
        </g>
        <!-- arrow up -->
        <g transform="translate(96,150)">
          <line x1="8" y1="0" x2="8" y2="26" />
          <path d="M2 8 L8 0 L14 8" />
        </g>
        <!-- gear-ish ring -->
        <circle cx="100" cy="205" r="14" />
        <circle cx="100" cy="205" r="4" />
        <!-- envelope -->
        <g transform="translate(190,205)">
          <rect x="0" y="0" width="34" height="24" rx="2" />
          <path d="M0 2 L17 15 L34 2" />
        </g>
      </g>
    </pattern>
  </defs>
  <rect width="480" height="480" fill="url(#tile)" />
</svg>
