<mat-card class="page-card">
  <mat-card-content>
    <!-- Page header -->
    <div class="page-header">
      <h1 class="page-title">Clients</h1>
      <button mat-flat-button color="primary" type="button">
        <mat-icon>add</mat-icon>
        Add Client
      </button>
    </div>

    <!-- Search and filters -->
    <div class="filters">
      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="search-field">
        <mat-icon matPrefix>search</mat-icon>
        <input matInput type="search" placeholder="Search clients..." aria-label="Search clients" />
      </mat-form-field>

      <mat-form-field appearance="outline" subscriptSizing="dynamic" class="status-field">
        <mat-select value="" aria-label="Filter by status">
          <mat-option value="">All Status</mat-option>
          <mat-option value="active">Active</mat-option>
          <mat-option value="inactive">Inactive</mat-option>
        </mat-select>
      </mat-form-field>
    </div>

    <!-- Client table -->
    <div class="table-scroll">
      <table mat-table [dataSource]="clients" class="client-table">
        <ng-container matColumnDef="select">
          <th mat-header-cell *matHeaderCellDef class="col-check">
            <mat-checkbox color="primary" aria-label="Select all clients"></mat-checkbox>
          </th>
          <td mat-cell *matCellDef="let client" class="col-check">
            <mat-checkbox color="primary" [attr.aria-label]="'Select ' + client.name"></mat-checkbox>
          </td>
        </ng-container>

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let client" class="client-name">{{ client.name }}</td>
        </ng-container>

        <ng-container matColumnDef="address">
          <th mat-header-cell *matHeaderCellDef>Address</th>
          <td mat-cell *matCellDef="let client">{{ client.address }}</td>
        </ng-container>

        <ng-container matColumnDef="website">
          <th mat-header-cell *matHeaderCellDef>Website</th>
          <td mat-cell *matCellDef="let client">
            <a class="website-link" [href]="'https://' + client.website" target="_blank" rel="noopener noreferrer">
              {{ client.website }}
            </a>
          </td>
        </ng-container>

        <ng-container matColumnDef="createdOn">
          <th mat-header-cell *matHeaderCellDef>Created On</th>
          <td mat-cell *matCellDef="let client">{{ client.createdOn }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Status</th>
          <td mat-cell *matCellDef="let client">
            <span
              class="status-badge"
              [class.status-active]="client.status === 'Active'"
              [class.status-inactive]="client.status === 'Inactive'"
            >{{ client.status }}</span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="col-center">Actions</th>
          <td mat-cell *matCellDef="let client" class="col-center">
            <div class="row-actions">
              @if (client.quickAction === 'view') {
                <button mat-icon-button type="button" matTooltip="View client" aria-label="View client">
                  <mat-icon>visibility</mat-icon>
                </button>
              } @else {
                <button mat-icon-button type="button" color="primary" matTooltip="Suspend client" aria-label="Suspend client">
                  <mat-icon>pause_circle_outline</mat-icon>
                </button>
              }
              <button mat-icon-button type="button" color="primary" matTooltip="Edit client" aria-label="Edit client">
                <mat-icon>edit</mat-icon>
              </button>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="delete">
          <th mat-header-cell *matHeaderCellDef class="col-center">
            <button mat-icon-button type="button" color="warn" matTooltip="Delete selected clients" aria-label="Delete selected clients">
              <mat-icon>delete_outline</mat-icon>
            </button>
          </th>
          <td mat-cell *matCellDef="let client" class="col-center">
            <button mat-icon-button type="button" color="warn" matTooltip="Delete client" aria-label="Delete client">
              <mat-icon>delete_outline</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>

    <!-- Table footer -->
    <mat-paginator
      [length]="clients.length"
      [pageSize]="10"
      [hidePageSize]="true"
      aria-label="Client listing pagination"
    ></mat-paginator>
  </mat-card-content>
</mat-card>
