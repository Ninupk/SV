<form [formGroup]="roleForm" (ngSubmit)="saveRole()">

  <div class="row g-4">
    <div class="col-12 col-md-5">
      <mat-card class="h-100">
        <mat-card-header>
          <mat-card-title>New Role</mat-card-title>
        </mat-card-header>

        <mat-card-content>

          <mat-form-field
            appearance="outline"
            class="w-100">

            <mat-label>Name</mat-label>

            <input
              matInput
              formControlName="name"
              placeholder="Name">

            @if (
              roleForm.get('name')?.hasError('required') &&
              roleForm.get('name')?.touched
            ) {
              <mat-error>
                Name is required
              </mat-error>
            }

          </mat-form-field>

        </mat-card-content>

      </mat-card>

    </div>


    <div class="col-12 col-md-7">

      <mat-card class="h-100">

        <mat-card-header>
          <mat-card-title>Permission</mat-card-title>
        </mat-card-header>

        <mat-card-content>

          <!-- Permission checkboxes -->

        </mat-card-content>

      </mat-card>

    </div>

  </div>

</form>
