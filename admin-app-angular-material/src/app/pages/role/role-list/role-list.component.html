<div class="card page-card">
    <div class="card-body">

        <!-- Header -->
        <div class="d-flex justify-content-between align-items-center mb-4 flex-wrap gap-2">
            <h4 class="mb-0">Role Listing</h4>
        </div>

        <!-- Filter -->
        <div class="row mb-3">
            <div class="col-md-4">
                <div class="d-flex align-items-center gap-1">                
                    <!-- Search Box -->
                    <div class="input-group">
                        <input class="form-control" type="search" placeholder="Search" aria-label="Search">
                        <button class="btn btn-primary px-3" type="submit">
                            <i class="bi bi-search"></i>
                        </button>
                    </div>                    
                    <!-- Clear Button -->
                    <button type="button" class="btn btn-light">
                        CLEAR
                    </button>
                </div>
            </div>
            <div class="col-md-8 text-end">
                <a href="#">View All Permissions</a>
            </div>
        </div>
        <div class="w-100 d-table mb-3">
            <div class="float-end d-flex gap-2">
                <!-- <button (click)="goToNextPage()" class="btn btn-primary btn-material"> -->
                <button [routerLink]="['/role/add-role']" class="btn btn-primary btn-material">
                    <i class="bi bi-plus-lg"></i> Add New Role
                </button>

                <button class="btn btn-success btn-material">
                    <i class="bi bi-download"></i> Export
                </button>
            </div>
        </div>
        <!-- Table -->
        
<div class="common-table-card">
  <div class="table-wrapper">
    <table mat-table [dataSource]="roles" class="common-table">

      <!-- Sl No -->
      <ng-container matColumnDef="slNo">
        <th mat-header-cell *matHeaderCellDef class="sl-no-column">
          Sl No
        </th>
        <td mat-cell *matCellDef="let role; let i = index">
          {{ i + 1 }}
        </td>
      </ng-container>

      <!-- Name -->
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let role">
          {{ role.name }}
        </td>
      </ng-container>

      <!-- Description -->
      <ng-container matColumnDef="description">
        <th mat-header-cell *matHeaderCellDef>Description</th>
        <td mat-cell *matCellDef="let role">
          {{ role.description }}
        </td>
      </ng-container>

      <!-- Permissions -->
      <ng-container matColumnDef="permissions">
        <th mat-header-cell *matHeaderCellDef>Permissions</th>
        <td mat-cell *matCellDef="let role">
          <div class="permission-list">
            @for (permission of role.permissions; track permission) {
              <span
                class="permission-badge"
                [ngClass]="'permission-' + permission.toLowerCase()">
                {{ permission }}
              </span>
            }
          </div>
        </td>
      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="actions-column">
          Actions
        </th>
        <td mat-cell *matCellDef="let role">
          <div class="action-buttons">
            <button
              mat-icon-button
              class="edit-action"
              aria-label="Edit role"
              matTooltip="Edit"
              [routerLink]="['/role/edit-role']">
              <mat-icon>edit</mat-icon>
            </button>

            <button
              mat-icon-button
              class="delete-action"
              aria-label="Delete role"
              matTooltip="Delete"
              (click)="deleteRole(role.id)">
              <mat-icon>delete_outline</mat-icon>
            </button>
          </div>
        </td>
      </ng-container>

      <!-- Table rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>

      <!-- Empty state -->
      <tr class="mat-mdc-row" *matNoDataRow>
        <td class="mat-mdc-cell empty-state"
            [attr.colspan]="displayedColumns.length">
          No roles found.
        </td>
      </tr>

    </table>
  </div>
</div>


        <!-- Footer -->
        <div class="d-flex justify-content-between align-items-center mt-3 flex-wrap">

            <div>
                Showing 1 to 3 of 25 entries
            </div>

            <!-- Pagination -->
            <nav>
                <ul class="pagination mb-0">
                    <li class="page-item disabled">
                        <a class="page-link">Previous</a>
                    </li>

                    <li class="page-item active">
                        <a class="page-link">1</a>
                    </li>

                    <li class="page-item">
                        <a class="page-link">2</a>
                    </li>

                    <li class="page-item">
                        <a class="page-link">3</a>
                    </li>

                    <li class="page-item">
                        <a class="page-link">Next</a>
                    </li>
                </ul>
            </nav>

        </div>

    </div>
</div>
