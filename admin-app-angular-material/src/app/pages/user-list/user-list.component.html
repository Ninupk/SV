<mat-card class="app-card table-card">
  <div class="table-card__head">
    <div>
      <h2 class="table-card__title">Users</h2>
      <p class="table-card__subtitle">Manage user accounts and their assigned roles.</p>
    </div>
    <button mat-flat-button color="primary" routerLink="/users/new">
      <mat-icon>add</mat-icon>
      Add User
    </button>
  </div>

  <div class="table-card__scroll">
    <table mat-table [dataSource]="[]" class="users-table">
      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Name</th>
        <td mat-cell *matCellDef="let user">{{ user.name }}</td>
      </ng-container>

      <ng-container matColumnDef="email">
        <th mat-header-cell *matHeaderCellDef>Email</th>
        <td mat-cell *matCellDef="let user">{{ user.email }}</td>
      </ng-container>

      <ng-container matColumnDef="role">
        <th mat-header-cell *matHeaderCellDef>Role</th>
        <td mat-cell *matCellDef="let user">{{ user.role }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let user">
          <mat-chip-set>
            <mat-chip [class]="'status-chip status-chip--' + user.status.toLowerCase()" disabled>
              {{ user.status }}
            </mat-chip>
          </mat-chip-set>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef></th>
        <td mat-cell *matCellDef="let user" class="users-table__actions">
          <button
            mat-icon-button
            [routerLink]="['/users', user.id, 'edit']"
            matTooltip="Edit user"
            aria-label="Edit user"
          >
            <mat-icon>edit_outlined</mat-icon>
          </button>
          <button mat-icon-button (click)="deleteUser(user)" matTooltip="Remove user" aria-label="Remove user">
            <mat-icon>delete_outline</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    </table>

    @if (true) {
      <p class="users-table__empty">No users yet — click "Add User" to create the first one.</p>
    }
  </div>
</mat-card>
