<mat-dialog-content class="dialog-content">
    <div class="profile-wrapper">

        <div class="container-fluid">

            <div class="row">

                <!-- Profile Image -->
                <div class="col-lg-3 col-md-4 profile-image-section">

                    <div class="profile-title">
                        Profile image
                    </div>

                    <img src="assets/images/profile-placeholder.png" alt="Profile image" class="profile-image">

                </div>


                <!-- User Details -->
                <div class="col-lg-5 col-md-8">

                    <div class="profile-details">

                        <div class="detail-row">
                            <div class="detail-label">
                                First Name:
                            </div>
                            <div class="detail-value">
                                John
                            </div>
                        </div>

                        <div class="detail-row">
                            <div class="detail-label">
                                Last Name:
                            </div>
                            <div class="detail-value">
                                4432
                            </div>
                        </div>

                        <div class="detail-row">
                            <div class="detail-label">
                                Email:
                            </div>
                            <div class="detail-value">
                                john.doe178539377316 &angmsdaa; example.com
                                <!-- or {{"john.doe1785393773168@example.com"}} -->
                            </div>
                        </div>

                        <div class="detail-row">
                            <div class="detail-label">
                                Phone:
                            </div>
                            <div class="detail-value">
                                &nbsp;
                            </div>
                        </div>

                        <div class="detail-row">
                            <div class="detail-label">
                                Role:
                            </div>
                            <div class="detail-value">
                                TestRole_7119
                            </div>
                        </div>

                        <div class="detail-row">
                            <div class="detail-label">
                                Status:
                            </div>
                            <div class="detail-value">
                                Awaiting Password Change
                            </div>
                        </div>

                    </div>

                </div>


                <!-- Actions -->
                <div class="col-lg-4 col-md-12">

                    <div class="actions">

                        <!-- Edit -->
                        <div class="action-item">
                            <button type="button" class="action-button" (click)="editUser()">
                                <i class="bi bi-pencil-fill"></i>
                            </button>
                            <span class="action-label">Edit</span>
                        </div>

                        <!-- Suspend -->
                        <div class="action-item">
                            <button type="button" class="action-button">
                                <i class="bi bi-person-fill-slash"></i>
                            </button>
                            <span class="action-label">Suspend</span>
                        </div>

                        <!-- Impersonate -->
                        <div class="action-item">
                            <button type="button" class="action-button">
                                <i class="bi bi-person-fill"></i>
                            </button>
                            <span class="action-label">Impersonate</span>
                        </div>

                        <!-- Email -->
                        <div class="action-item">
                            <button type="button" class="action-button">
                                <i class="bi bi-envelope-fill"></i>
                            </button>
                            <span class="action-label">Email</span>
                        </div>

                        <!-- Credentials -->
                        <div class="action-item">
                            <button type="button" class="action-button">
                                <i class="bi bi-shield-fill"></i>
                            </button>
                            <span class="action-label">Credentials</span>
                        </div>

                        <!-- Delete -->
                        <div class="action-item">
                            <button type="button" class="action-button">
                                <i class="bi bi-trash-fill"></i>
                            </button>
                            <span class="action-label">Delete</span>
                        </div>

                    </div>

                </div>

            </div>


            <!-- Footer -->
            <div class="profile-footer">

                <button type="button" class="cancel-btn">
                    CANCEL
                </button>

            </div>

        </div>

    </div>
</mat-dialog-content>
