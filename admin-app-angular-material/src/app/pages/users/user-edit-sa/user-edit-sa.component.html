<mat-card class="page-card">
  <mat-card-header>
    <h1 class="h4 mb-4">Edit User</h1>
    <!-- <mat-card-title>Manage User</mat-card-title> -->
  </mat-card-header>

  <mat-card-content>
    <div class="profile-wrapper">

      <!-- Profile image -->
      <section class="profile-image-section">
        <div class="profile-title">Profile image</div>
        <div class="profile-icon">
          <mat-icon>person</mat-icon>
        </div>
      </section>

      <!-- User details -->
      <section class="profile-details">
        <div class="detail-row">
          <span class="label">First Name:</span>
          <span class="value"><input type="text" class="form-control"></span>
        </div>
        <div class="detail-row">
          <span class="label">Last Name:</span>
          <span class="value"><input type="text" class="form-control"></span>
        </div>
        <div class="detail-row">
          <span class="label">Email:</span>
          <span class="value"><input type="text" class="form-control"></span>
        </div>
        <div class="detail-row">
          <span class="label">Phone:</span>
          <span class="value"><input type="text" class="form-control"></span>
        </div>
        <div class="detail-row">
          <span class="label">Role:</span>
          <span class="value">
            <select name="" id="" class="form-select">
              <option value="">Option 1</option>
              </select>
          </span>
        </div>
        <div class="detail-row">
          <span class="label">Status:</span>
          <span class="value">
            <mat-chip-set>
              <mat-chip>Awaiting Approval</mat-chip>
            </mat-chip-set>
          </span>
        </div>
      </section>

      <!-- Actions -->
      <section class="actions">
        <div class="action-item">
          <button mat-mini-fab color="primary" type="button">
            <mat-icon>edit</mat-icon>
          </button>
          <span class="action-label">Edit</span>
        </div>

        <div class="action-item">
          <button mat-mini-fab color="primary" type="button" aria-label="Suspend">
            <mat-icon>person_off</mat-icon>
          </button>
          <span class="action-label">Suspend</span>
        </div>

        <div class="action-item">
          <button mat-mini-fab color="primary" type="button" aria-label="Impersonate">
            <mat-icon>supervisor_account</mat-icon>
          </button>
          <span class="action-label">Impersonate</span>
        </div>

        <div class="action-item">
          <button mat-mini-fab color="primary" type="button" aria-label="Email">
            <mat-icon>email</mat-icon>
          </button>
          <span class="action-label">Email</span>
        </div>

        <div class="action-item">
          <button mat-mini-fab color="primary" type="button" aria-label="Credentials">
            <mat-icon>shield</mat-icon>
          </button>
          <span class="action-label">Credentials</span>
        </div>

        <div class="action-item">
          <button mat-mini-fab color="warn" type="button" aria-label="Delete">
            <mat-icon>delete</mat-icon>
          </button>
          <span class="action-label">Delete</span>
        </div>
      </section>
    </div>
  </mat-card-content>

  <mat-divider></mat-divider>

  <mat-card-actions align="end">
    <button mat-stroked-button type="button" (click)="cancel()">CANCEL</button>
    <button type="button" class="btn btn-primary px-4 ms-2" (click)="saveUser()">SAVE</button>
  </mat-card-actions>
</mat-card>
